# electron-builder — the desktop distributables.
#
# Notarization credentials are read from the environment and are never
# committed: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID, which
# @electron/notarize picks up on its own when `mac.notarize` is true. Signing
# uses whatever Developer ID Application identity is in the keychain.
appId: com.acwright.vtac
productName: VT-AC
copyright: Copyright © 2026 A.C. Wright

directories:
  buildResources: build
  output: dist

# `out/` is everything electron-vite and `build:cli` emit — main, preload,
# renderer and the CLI. Packed at the asar root with its path preserved, which
# is what lets CliShimService point the shim at `app.asar/out/cli/index.js`.
# VT-AC has no bundled ROM or data files, so there is no extraResources.
files:
  - out/**/*

mac:
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  # Freedesktop's own category for this kind of program; it is what puts VT-AC
  # next to the other terminals in a desktop menu rather than under Development.
  category: System;TerminalEmulator
  # `vt-ac`, and deliberately not `vtac` — the deb's postinst symlinks
  # /usr/bin/<executableName>, so naming the app binary `vtac` would put the
  # *app launcher* on PATH under the name the CLI shim wants. It would answer
  # `vtac --version` with Electron's version and drop every flag, since nothing
  # would be parsing them. Linux is the only platform where this can happen:
  # macOS hides its binary inside VT-AC.app and Windows leaves VT-AC.exe in a
  # directory that is not on PATH. So the app is `vt-ac` here and `vtac` stays
  # the command — which is what `src/cli/launch.ts` looks for at
  # /opt/VT-AC/vt-ac and /usr/bin/vt-ac. Left unset the name would come from
  # package.json (`vtac-terminal`) and match nothing at all.
  executableName: vt-ac
  synopsis: A fantasy VT terminal
  # The .desktop file is named from package.json's `desktopName` (vtac.desktop),
  # which is also what Electron uses as the window app_id — syncing the two is
  # what lets a desktop environment associate a running window with the entry.
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# serialport ships a native binding. It cannot be loaded from inside an asar, so
# it is unpacked next to it, and it has to be built against Electron's ABI
# rather than the system Node's — which is what npmRebuild does.
asarUnpack:
  - "**/*.node"

npmRebuild: true
