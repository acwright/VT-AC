name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The Electron binary is only needed to *run* the app; typechecking,
          # the tests and both builds below work without downloading 100 MB.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # deploy.yml builds this too, but only after a push to main has already
      # happened. Building it here is what makes a pull request that breaks the
      # web bundle fail before it is merged rather than after it is published.
      - name: Build web
        run: npm run build:web
